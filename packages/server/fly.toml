# fly.toml for the mineshoot Colyseus server.
# Once: fly launch --no-deploy -c packages/server/fly.toml  (pick your own app name/region and edit below)
# Deploy from the REPO ROOT: fly deploy -c packages/server/fly.toml

app = 'mineshoot-server-prd'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
